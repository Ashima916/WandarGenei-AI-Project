version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wandergenie-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAPI_API_KEY}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: wandergenie-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

networks:
  default:
    name: wandergenie-network
